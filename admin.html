<!DOCTYPE html>
<html lang="id">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Rojak DriveKit - Admin</title>

  <link
    rel="icon"
    type="image/png"
    href="https://files.catbox.moe/brdrmx.png"
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>

    :root {
      --bg:#0b0b0c;
      --surface:#111112;
      --surface2:#171718;
      --surface3:#1d1d1f;

      --line:#29292b;
      --line2:#38383b;

      --text:#e7e7e9;
      --muted:#8b8b91;

      --accent:#c94f32;
      --accent-hover:#db5d3d;

      --green:#67b87a;
      --red:#d8665c;
    }


    * {
      box-sizing:border-box;
    }


    html {
      background:var(--bg);
    }


    body {
      margin:0;
      min-height:100vh;

      background:var(--bg);

      color:var(--text);

      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }


    button,
    select {
      font:inherit;
    }


    button {
      cursor:pointer;
    }


    /* =========================
       TOPBAR
    ========================== */

    .topbar {
      height:56px;

      display:flex;
      align-items:center;
      justify-content:space-between;

      padding:0 22px;

      border-bottom:1px solid var(--line);

      background:var(--surface);
    }


    .brand {
      display:flex;
      align-items:center;

      gap:9px;

      font-size:11px;
      font-weight:700;
    }


    .brand-mark {
      width:30px;
      height:30px;

      display:grid;
      place-items:center;

      overflow:hidden;

      border:1px solid var(--line);

      border-radius:7px;

      background:var(--surface2);
    }


    .brand-mark img {
      width:100%;
      height:100%;

      display:block;

      object-fit:cover;
    }


    .back {
      height:31px;

      padding:0 10px;

      border:1px solid var(--line);

      border-radius:6px;

      background:var(--surface2);

      color:var(--muted);

      font-size:9px;
      font-weight:600;
    }


    .back:hover {
      border-color:var(--line2);

      color:var(--text);

      background:var(--surface3);
    }


    /* =========================
       MAIN
    ========================== */

    .container {
      width:min(
        1040px,
        calc(100% - 32px)
      );

      margin:auto;

      padding:38px 0 60px;
    }


    .page-head {
      margin-bottom:22px;
    }


    .page-head h1 {
      margin:0;

      font-size:26px;
      font-weight:700;

      letter-spacing:-.8px;
    }


    .page-head p {
      margin:6px 0 0;

      color:var(--muted);

      font-size:10px;
      line-height:1.5;
    }


    /* =========================
       SUMMARY
    ========================== */

    .summary {
      display:flex;
      align-items:center;

      gap:18px;

      padding:11px 0;

      border-top:1px solid var(--line);
      border-bottom:1px solid var(--line);

      color:var(--muted);

      font-size:9px;
    }


    .summary-item {
      display:flex;
      align-items:center;

      gap:5px;
    }


    .summary-value {
      color:var(--text);

      font-size:10px;
      font-weight:700;
    }


    .summary-divider {
      width:1px;
      height:12px;

      background:var(--line2);
    }


    /* =========================
       USERS
    ========================== */

    .users-section {
      margin-top:27px;
    }


    .section-head {
      display:flex;
      align-items:center;
      justify-content:space-between;

      margin-bottom:9px;
    }


    .section-title {
      margin:0;

      font-size:12px;
      font-weight:700;
    }


    .section-info {
      color:var(--muted);

      font-size:8px;
    }


    /* =========================
       TABLE
    ========================== */

    .user-table {
      overflow:hidden;

      border:1px solid var(--line);

      border-radius:8px;

      background:var(--surface);
    }


    .user-table-head {
      display:grid;

      grid-template-columns:
        minmax(260px,1fr)
        120px
        210px;

      align-items:center;

      min-height:36px;

      padding:0 12px;

      border-bottom:1px solid var(--line);

      color:var(--muted);

      font-size:8px;
      font-weight:700;

      letter-spacing:.3px;
    }


    .user-row {
      display:grid;

      grid-template-columns:
        minmax(260px,1fr)
        120px
        210px;

      align-items:center;

      min-height:66px;

      padding:8px 12px;

      border-bottom:1px solid var(--line);
    }


    .user-row:last-child {
      border-bottom:0;
    }


    .user-row:hover {
      background:#131314;
    }


    /* =========================
       USER
    ========================== */

    .user-main {
      display:flex;
      align-items:center;

      gap:10px;

      min-width:0;
    }


    .avatar {
      width:34px;
      height:34px;

      flex:0 0 auto;

      border-radius:50%;

      object-fit:cover;

      background:var(--surface3);
    }


    .user-details {
      min-width:0;
    }


    .name {
      overflow:hidden;

      color:var(--text);

      font-size:10px;
      font-weight:700;

      text-overflow:ellipsis;
      white-space:nowrap;
    }


    .email {
      overflow:hidden;

      margin-top:3px;

      color:var(--muted);

      font-size:8px;

      text-overflow:ellipsis;
      white-space:nowrap;
    }


    /* =========================
       ROLE
    ========================== */

    .role-select {
      width:96px;
      height:30px;

      padding:0 7px;

      border:1px solid var(--line);

      border-radius:6px;

      outline:none;

      background:var(--surface2);

      color:var(--text);

      font-size:9px;
    }


    .role-select:hover {
      border-color:var(--line2);
    }


    .role-select:focus {
      border-color:var(--accent);
    }


    .self-role {
      color:var(--accent-hover);

      font-size:8px;
      font-weight:700;
    }


    /* =========================
       UID
    ========================== */

    .uid {
      overflow:hidden;

      color:#6f6f75;

      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        monospace;

      font-size:8px;

      text-overflow:ellipsis;
      white-space:nowrap;
    }


    /* =========================
       MESSAGE
    ========================== */

    .message {
      padding:40px 15px;

      text-align:center;

      color:var(--muted);

      font-size:9px;
    }


    .error {
      color:var(--red);
    }


    /* =========================
       MOBILE
    ========================== */

    @media(max-width:700px) {

      .topbar {
        height:52px;

        padding:0 12px;
      }


      .brand {
        font-size:10px;
      }


      .brand-mark {
        width:27px;
        height:27px;
      }


      .container {
        width:calc(100% - 20px);

        padding:28px 0 45px;
      }


      .page-head h1 {
        font-size:23px;
      }


      .summary {
        flex-wrap:wrap;

        gap:8px 14px;
      }


      .summary-divider {
        display:none;
      }


      .user-table-head {
        display:none;
      }


      .user-row {
        display:block;

        min-height:auto;

        padding:13px;
      }


      .user-main {
        margin-bottom:12px;
      }


      .role-select {
        width:100%;
      }


      .uid {
        margin-top:9px;

        padding-left:44px;
      }

    }

  </style>

</head>


<body>


  <!-- TOPBAR -->

  <header class="topbar">


    <div class="brand">

      <div class="brand-mark">

        <img
          src="https://files.catbox.moe/brdrmx.png"
          alt="Rojak DriveKit"
        >

      </div>


      <span>
        Rojak DriveKit · Admin
      </span>

    </div>



    <button
      id="backButton"
      class="back"
    >
      ← Kembali
    </button>


  </header>



  <!-- MAIN -->

  <main class="container">


    <div class="page-head">

      <h1>
        Users
      </h1>

      <p>
        Kelola akses pengguna Rojak DriveKit.
      </p>

    </div>



    <!-- SUMMARY -->

    <div class="summary">


      <div class="summary-item">

        <span>
          Users
        </span>

        <span
          id="totalUsers"
          class="summary-value"
        >
          0
        </span>

      </div>


      <div class="summary-divider"></div>


      <div class="summary-item">

        <span>
          Admin
        </span>

        <span
          id="totalAdmins"
          class="summary-value"
        >
          0
        </span>

      </div>


      <div class="summary-divider"></div>


      <div class="summary-item">

        <span>
          Member
        </span>

        <span
          id="totalMembers"
          class="summary-value"
        >
          0
        </span>

      </div>


    </div>



    <!-- USERS -->

    <section class="users-section">


      <div class="section-head">

        <h2 class="section-title">
          Daftar pengguna
        </h2>

        <span class="section-info">
          Role dapat diubah oleh Admin
        </span>

      </div>



      <div class="user-table">


        <div class="user-table-head">

          <div>
            USER
          </div>

          <div>
            ROLE
          </div>

          <div>
            UID
          </div>

        </div>



        <div
          id="message"
          class="message"
        >
          Memuat pengguna...
        </div>



        <div
          id="usersTable"
          style="display:none;"
        ></div>


      </div>


    </section>


  </main>



  <!-- FIREBASE -->

  <script type="module">


    import {
      auth,
      db
    } from "./firebase-config.js";


    import {
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


    import {
      collection,
      getDocs,
      doc,
      getDoc,
      updateDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";



    const $ =
      id => document.getElementById(id);



    /* =========================
       ESCAPE HTML
    ========================== */

    function escapeHTML(
      value
    ) {

      return String(value)

        .replaceAll(
          "&",
          "&amp;"
        )

        .replaceAll(
          "<",
          "&lt;"
        )

        .replaceAll(
          ">",
          "&gt;"
        )

        .replaceAll(
          '"',
          "&quot;"
        )

        .replaceAll(
          "'",
          "&#039;"
        );

    }



    /* =========================
       ADMIN CHECK
    ========================== */

    async function loadAdmin() {


      onAuthStateChanged(

        auth,

        async user => {


          if (!user) {

            window.location.href =
              "./index.html";

            return;

          }



          try {


            const currentRef =
              doc(
                db,
                "users",
                user.uid
              );


            const currentSnap =
              await getDoc(
                currentRef
              );



            if (
              !currentSnap.exists() ||

              currentSnap.data().role !==
              "admin"
            ) {


              $("message").innerHTML =

                `<span class="error">
                  Kamu tidak memiliki akses Admin.
                </span>`;


              return;

            }



            await loadUsers(
              user.uid
            );


          } catch(error) {


            console.error(
              error
            );


            $("message").innerHTML =

              `<span class="error">
                Gagal memuat Admin Dashboard.
              </span>`;

          }

        }

      );

    }



    /* =========================
       LOAD USERS
    ========================== */

    async function loadUsers(
      currentUid
    ) {


      const snapshot =
        await getDocs(

          collection(
            db,
            "users"
          )

        );



      const users =
        snapshot.docs.map(

          item => ({

            id:item.id,

            ...item.data()

          })

        );



      let admins = 0;

      let members = 0;



      users.forEach(
        user => {

          if (
            user.role === "admin"
          ) {

            admins++;

          } else {

            members++;

          }

        }
      );



      $("totalUsers").textContent =
        users.length;


      $("totalAdmins").textContent =
        admins;


      $("totalMembers").textContent =
        members;



      if (!users.length) {

        $("message").textContent =
          "Belum ada user.";

        $("message").style.display =
          "block";

        $("usersTable").style.display =
          "none";

        return;

      }



      $("message").style.display =
        "none";


      $("usersTable").style.display =
        "block";



      $("usersTable").innerHTML =


        users.map(
          user => {


            const photo =
              user.photoURL ||

              "https://www.gravatar.com/avatar/?d=mp";



            const isSelf =
              user.id === currentUid;



            return `

              <div class="user-row">


                <div class="user-main">


                  <img
                    class="avatar"
                    src="${escapeHTML(photo)}"
                    alt=""
                  >


                  <div class="user-details">


                    <div class="name">

                      ${escapeHTML(
                        user.name ||
                        "User"
                      )}

                    </div>


                    <div class="email">

                      ${escapeHTML(
                        user.email ||
                        "-"
                      )}

                    </div>


                  </div>


                </div>



                <div>


                  ${
                    isSelf

                    ?

                    `<div class="self-role">
                      ADMIN · YOU
                    </div>`

                    :

                    `<select
                      class="role-select roleSelect"
                      data-uid="${escapeHTML(user.id)}"
                    >

                      <option
                        value="member"
                        ${
                          user.role === "member"
                            ? "selected"
                            : ""
                        }
                      >
                        Member
                      </option>


                      <option
                        value="admin"
                        ${
                          user.role === "admin"
                            ? "selected"
                            : ""
                        }
                      >
                        Admin
                      </option>

                    </select>`

                  }


                </div>



                <div class="uid">

                  ${escapeHTML(
                    user.id
                  )}

                </div>


              </div>

            `;

          }

        ).join("");



      /* =========================
         ROLE CHANGE
      ========================== */

      document
        .querySelectorAll(
          ".roleSelect"
        )
        .forEach(

          select => {


            select.addEventListener(

              "change",

              async event => {


                const uid =
                  event.target.dataset.uid;


                const newRole =
                  event.target.value;



                try {


                  event.target.disabled =
                    true;



                  await updateDoc(

                    doc(
                      db,
                      "users",
                      uid
                    ),

                    {

                      role:newRole,

                      updatedAt:
                        serverTimestamp()

                    }

                  );



                  await loadUsers(
                    currentUid
                  );


                } catch(error) {


                  console.error(
                    error
                  );


                  alert(
                    "Gagal mengubah role: " +

                    (
                      error.code ||
                      error.message
                    )
                  );


                  event.target.disabled =
                    false;

                }

              }

            );

          }

        );

    }



    /* =========================
       BACK
    ========================== */

    $("backButton").onclick =

      () => {

        window.location.href =
          "./index.html";

      };



    /* =========================
       START
    ========================== */

    loadAdmin();


  </script>


</body>
</html>
